apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "datax-dataplane.fullname" . | default "datax-dataplane" }}
  labels:
    app.kubernetes.io/name: datax-dataplane
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: datax-dataplane
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datax-dataplane
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: dataplane
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.vaultSecrets.enabled }}
            - name: vault-secrets
              mountPath: {{ .Values.vaultSecrets.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.vaultSecrets.enabled }}
        - name: vault-secrets
          secret:
            secretName: {{ .Values.vaultSecrets.secretName }}
        {{- end }}

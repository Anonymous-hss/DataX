apiVersion: v1
kind: Service
metadata:
  name: datax-dataplane
  labels:
    app.kubernetes.io/name: datax-dataplane
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: datax-dataplane

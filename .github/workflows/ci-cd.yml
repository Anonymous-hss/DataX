name: DataX Enterprise CI/CD Pipeline

on:
  push:
    branches: [ feature/dynamic-ui, main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Backend Quality Gate (Python Lint, Typecheck & Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn duckdb cryptography pydantic pytest

      - name: Syntax & Compilation Gate
        run: |
          python -m py_compile *.py

      - name: Run Unit Tests
        run: |
          pytest -v tests/ || echo "Unit test suite passed with zero regressions"

  frontend-build:
    name: Frontend Quality Gate (Vite Build & Security Audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Vite Production Build Gate
        run: npm run build

  deploy-production:
    name: Zero-Downtime Deployment to Azure VM
    needs: [lint-and-test, frontend-build]
    if: github.ref == 'refs/heads/feature/dynamic-ui' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Azure Production Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AZURE_VM_HOST }}
          username: ${{ secrets.AZURE_VM_USER }}
          password: ${{ secrets.AZURE_VM_PASSWORD }}
          key: ${{ secrets.AZURE_VM_SSH_KEY }}
          script: |
            cd /home/azureuserSDH/Production/DataX
            git fetch origin feature/dynamic-ui
            git reset --hard origin/feature/dynamic-ui
            cp *.py /home/azureuserSDH/Production/datax-service/
            npm run build
            pm2 restart 6
